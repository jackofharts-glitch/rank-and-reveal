name: Apply best-guess update from zip (one-off)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Re-apply Patrick Hand font in style.css
        run: |
          python3 - <<'PYEOF'
          p = 'public/style.css'
          s = open(p).read()
          if '"Patrick Hand"' in s:
              print('Patrick Hand already present, nothing to do')
          else:
              anchor = '@font-face {\n  font-family: "Bobby Jones";'
              assert anchor in s, 'Bobby Jones @font-face not found'
              ph = ('/* Patrick Hand: self-hosted hand-drawn marker-style font from Google Fonts\n'
                    '   (public/fonts/PatrickHand.woff2). It is first in the --hand stack below. */\n'
                    '@font-face {\n'
                    '  font-family: "Patrick Hand"; font-weight: 400; font-style: normal; font-display: swap;\n'
                    '  src: local("Patrick Hand"), url("/fonts/PatrickHand.woff2") format("woff2");\n'
                    '}\n')
              i = s.index(anchor)
              end = s.index('}', s.index('format("opentype");', i)) + 1
              s = s[:end] + '\n' + ph + s[end:]
              old = '--hand: "Bobby Jones", "Barriecito",'
              new = '--hand: "Patrick Hand", "Bobby Jones", "Barriecito",'
              assert old in s, '--hand line not found'
              s = s.replace(old, new, 1)
              open(p, 'w').write(s)
              print('style.css patched: Patrick Hand @font-face added and first in --hand')
          PYEOF
          echo "--- verify ---"
          grep -m1 -- '--hand' public/style.css
          grep -c 'Patrick Hand' public/style.css
          ls public/fonts/

      - name: Commit and push
        run: |
          git config user.name "jackofharts-glitch"
          git config user.email "jackofharts-glitch@users.noreply.github.com"
          git add -A
          git commit -m "Re-apply Patrick Hand as the first font in style.css (preserve user font choice)" || echo "nothing to commit"
          git push
