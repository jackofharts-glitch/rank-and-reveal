name: Add Patrick Hand font
on:
  workflow_dispatch:
jobs:
  add-font:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Patrick Hand woff2 from Google Fonts
        run: |
          set -euo pipefail
          css=$(curl -fsSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" "https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap")
          url=$(printf '%s\n' "$css" | awk '/\/\* latin \*\//{f=1} f && /url\(/{print; exit}' | grep -o 'https://[^)]*')
          echo "Font URL: $url"
          test -n "$url"
          curl -fsSL -o public/fonts/PatrickHand.woff2 "$url"
          ls -l public/fonts/PatrickHand.woff2
          # sanity check: a woff2 file starts with the magic bytes wOF2
          head -c 4 public/fonts/PatrickHand.woff2 | grep -q wOF2
          echo "OK: valid woff2 downloaded"
      - name: Remove temp workflow and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/add-patrick-hand.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "jackofharts-glitch"
          git config user.email "jackhart0911@gmail.com"
          git add -A
          git commit -m "Add Patrick Hand font (self-hosted woff2 from Google Fonts)"
          git push
