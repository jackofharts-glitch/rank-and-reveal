name: Replace fanfare sound (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename fanfare-new.mp3 to fanfare.mp3
        run: |
          git config user.name "jackofharts-glitch"
          git config user.email "jackhart0911@gmail.com"
          git mv public/sounds/fanfare-new.mp3 public/sounds/fanfare.mp3
          git commit -m "Replace public/sounds/fanfare.mp3 with the new fanfare sound"
          git push
