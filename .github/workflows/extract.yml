name: Extract best-guess.zip
on:
  push:
    branches: [main]
    paths: ['.github/workflows/extract.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive into repo
        run: |
          set -eux
          test -f best-guess.zip
          unzip -o best-guess.zip
          cp -a best-guess/. .
          rm -rf best-guess best-guess.zip
          rm -f .github/workflows/extract.yml
          rmdir -p .github/workflows .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Best guess? UI from best-guess.zip [skip ci]" || echo "nothing to commit"
          git push
